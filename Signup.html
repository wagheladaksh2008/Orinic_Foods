<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="icon"
    type="image/png"
    href="images/logo.png"
  >

  <title>Create Account | Orinic Foods</title>

  <link rel="stylesheet" href="Signup.css">

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>


<body>

  <main class="signup-page">

    <div class="signup-card">


      <!-- LOGO -->

      <div class="signup-logo">

        <img
          src="images/logo.png"
          alt="Orinic Foods"
        >

        <span>Orinic Foods</span>

      </div>


      <!-- HEADER -->

      <div class="signup-header">

        <h1>Create your account</h1>

        <p>
          Join Orinic Foods and start your crunchy journey
        </p>

      </div>


      <!-- SIGNUP FORM -->

      <form id="signupForm">


        <!-- FULL NAME -->

        <div class="form-group">

          <label for="fullName">
            Full Name
          </label>

          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            required
          >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          >

        </div>


        <!-- PHONE -->

        <div class="form-group">

          <label for="phone">
            Phone Number
          </label>

          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
          >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="togglePassword"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="toggleConfirmPassword"
              aria-label="Show password"
            >
              👁
            </button>

          </div>

        </div>


        <!-- SIGN UP BUTTON -->

        <button
          type="submit"
          class="signup-btn"
        >

          <span>Create Account</span>

          <span class="arrow">→</span>

        </button>


      </form>


      <!-- LOGIN LINK -->

      <div class="login-link">

        <span>
          Already have an account?
        </span>

        <a href="Login.html">
          Log In
        </a>

      </div>


    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="Signup.js"></script>
</body>

</html>
